[project]
name = "deep-research-agent"
version = "0.1.0"
description = "多智能体深度研究与报告生成系统（Planner-Researcher-Verifier-Writer）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.50",        # 兼容任意厂商 base_url
    "httpx>=0.27",
    "pyyaml>=6.0",         # 评测集
    "rank-bm25>=0.2.10",   # W2 片段筛选
    "trafilatura>=1.8",    # 默认网页正文抽取（Jina Reader 仅作增强）
    "lxml_html_clean>=0.4",  # 新版 lxml 拆包：trafilatura→justext 依赖，缺了 import 即断
    "gradio>=4",             # W4 demo UI（app/gradio_ui.py）
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
